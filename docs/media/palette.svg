<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t">
  <title id="t">South.air color palette</title>
  <style>
    .g { font: 600 15px Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F36D03; letter-spacing: 2px; }
    .n { font: 500 15px Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E3E3E2; }
    .h { font: 400 14px 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace; fill: #A1A1A2; }
  </style>
  <rect width="1280" height="470" rx="24" fill="#100E0E"/>
  <rect x="0.5" y="0.5" width="1279" height="469" rx="24" fill="none" stroke="#2B2B2D"/>

  <text x="40" y="52" class="g">STRUCTURE</text>
  <g transform="translate(40 68)">
    <rect width="186" height="64" rx="12" fill="#100E0E" stroke="#2B2B2D"/><text y="88" class="n">Background</text><text y="108" class="h">#100E0E</text>
    <g transform="translate(202 0)"><rect width="186" height="64" rx="12" fill="#141414" stroke="#2B2B2D"/><text y="88" class="n">Panel</text><text y="108" class="h">#141414</text></g>
    <g transform="translate(404 0)"><rect width="186" height="64" rx="12" fill="#1A1A1B" stroke="#2B2B2D"/><text y="88" class="n">Surface</text><text y="108" class="h">#1A1A1B</text></g>
    <g transform="translate(606 0)"><rect width="186" height="64" rx="12" fill="#202123" stroke="#2B2B2D"/><text y="88" class="n">Control</text><text y="108" class="h">#202123</text></g>
    <g transform="translate(808 0)"><rect width="186" height="64" rx="12" fill="#2B2B2D"/><text y="88" class="n">Border</text><text y="108" class="h">#2B2B2D</text></g>
    <g transform="translate(1010 0)"><rect width="186" height="64" rx="12" fill="#292727"/><text y="88" class="n">Graph grid</text><text y="108" class="h">#292727</text></g>
  </g>

  <text x="40" y="208" class="g">BRAND ORANGE</text>
  <g transform="translate(40 224)">
    <rect width="186" height="64" rx="12" fill="#F36D03"/><text y="88" class="n">Orange</text><text y="108" class="h">#F36D03</text>
    <g transform="translate(202 0)"><rect width="186" height="64" rx="12" fill="#FA8603"/><text y="88" class="n">Orange active</text><text y="108" class="h">#FA8603</text></g>
    <g transform="translate(404 0)"><rect width="186" height="64" rx="12" fill="#A54D05"/><text y="88" class="n">Orange deep</text><text y="108" class="h">#A54D05</text></g>
    <g transform="translate(606 0)"><rect width="186" height="64" rx="12" fill="#522304"/><text y="88" class="n">Orange glow</text><text y="108" class="h">#522304</text></g>
    <g transform="translate(808 0)"><rect width="186" height="64" rx="12" fill="#FBA45A"/><text y="88" class="n">Orange soft</text><text y="108" class="h">#FBA45A</text></g>
  </g>

  <text x="40" y="364" class="g">TYPE</text>
  <g transform="translate(40 380)">
    <rect width="186" height="44" rx="12" fill="#E3E3E2"/><text x="200" y="20" class="n">Text primary</text><text x="200" y="40" class="h">#E3E3E2</text>
    <g transform="translate(404 0)"><rect width="186" height="44" rx="12" fill="#A1A1A2"/><text x="200" y="20" class="n">Text secondary</text><text x="200" y="40" class="h">#A1A1A2</text></g>
    <g transform="translate(808 0)"><rect width="186" height="44" rx="12" fill="#68686B"/><text x="200" y="20" class="n">Text muted</text><text x="200" y="40" class="h">#68686B</text></g>
  </g>
</svg>
