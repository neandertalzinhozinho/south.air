[package]
name = "resonia"
version = "0.1.0"
edition = "2021"
description = "Resonia - VST3 plugin shell (engine boundary: src/engine_bridge.rs)"
default-run = "resonia-app"

[lib]
name = "resonia"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "resonia-app"
path = "src/main.rs"

[features]
default = []
# Liga o motor traduzido do dump (crates `lifted` + `lifted_extra`, por path). Sem a feature o
# plugin passa direto (sem DSP). O dump e lido em tempo de execucao (RESONIA_DUMP); ver
# src/engine_bridge.rs.
motor = ["dep:soultree_lifted", "dep:soultree_lifted_extra"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
hound = "3.5"
# Rasteriza os ícones SVG dos recursos recuperados (só na tela).
resvg = { version = "0.45", default-features = false }
# Motor (opcional): so entra com `--features motor`.
soultree_lifted = { path = "../../lifted", optional = true }
soultree_lifted_extra = { path = "../../lifted_extra", optional = true }

[profile.release]
lto = "thin"
strip = "symbols"

# O codigo traduzido e enorme (~24 MB de Rust): mesmo perfil de lifted/Cargo.toml (perfis de
# dependencias nao valem, entao repetimos aqui).
[profile.release.package.soultree_lifted]
opt-level = 3
codegen-units = 64
incremental = false

[profile.release.package.soultree_lifted_extra]
opt-level = 3
codegen-units = 64
incremental = false
