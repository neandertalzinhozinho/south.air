[package]
name = "resonia"
version = "0.1.0"
edition = "2021"
description = "Resonia - VST3 plugin shell (engine boundary: src/engine_bridge.rs)"
default-run = "resonia-app"

[lib]
name = "resonia"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "resonia-app"
path = "src/main.rs"

[features]
default = []
# Liga o port do motor (D:\PROJETOS\soultree FORK\port). Hoje so liga a dependencia e expoe a
# versao do port em engine_bridge; a cadeia de processamento continua NAO chamada (ver o TODO
# em src/engine_bridge.rs e o plano em resonia/RECUPERACAO.md).
motor = ["dep:soultree_port"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
hound = "3.5"
# Motor (opcional): so entra com `--features motor`.
soultree_port = { path = "../../port", optional = true }

[profile.release]
lto = "thin"
strip = "symbols"
